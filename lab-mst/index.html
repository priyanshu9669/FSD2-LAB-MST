<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Box with Character Counter</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN for compiling JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #f3f4f6;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .user-name {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }

    .user-handle {
      font-size: 12px;
      color: #6b7280;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      box-sizing: border-box;
      font-size: 15px;
      color: #1f2937;
      outline: none;
      resize: none;
      transition: all 0.2s ease;
      background-color: #f9fafb;
      font-family: inherit;
    }

    textarea:focus {
      background-color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea.exceeded {
      border-color: #ef4444;
      background-color: #fff5f5;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .icons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background-color: #f3f4f6;
    }

    .counter-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .limit-error {
      color: #ef4444;
      font-size: 13px;
      font-weight: 600;
      background-color: #fef2f2;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #fee2e2;
    }

    .counter-text {
      font-size: 13px;
      font-family: monospace;
      color: #6b7280;
    }

    .counter-text.exceeded {
      color: #ef4444;
      font-weight: bold;
    }

    .post-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #ffffff;
      background-color: #2563eb;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .post-btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .post-btn:not(:disabled):hover {
      background-color: #1d4ed8;
    }

    .toast {
      margin-top: 14px;
      padding: 10px;
      background-color: #ecfdf5;
      color: #047857;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const MAX_LIMIT = 100;

    function PostBox() {
      // 1. Controlled textarea state
      const [content, setContent] = React.useState('');
      const [posted, setPosted] = React.useState(false);

      const charCount = content.length;
      const isExceeded = charCount > MAX_LIMIT;
      const isEmpty = content.trim().length === 0;

      // 4. Disable Post button when text is empty OR over limit
      const isButtonDisabled = isEmpty || isExceeded;

      const handlePost = () => {
        setPosted(true);
        setContent('');
        setTimeout(() => setPosted(false), 3000);
      };

      return (
        <div className="card">
          {/* User Profile Header */}
          <div className="header">
            <div className="avatar">G</div>
            <div>
              <h4 className="user-name">Alex Developer</h4>
              <span className="user-handle">@alex_dev • Public</span>
            </div>
          </div>

          {/* 1. Controlled Textarea */}
          <textarea
            placeholder="What's happening?"
            value={content}
            onChange={(e) => setContent(e.target.value)}
            className={isExceeded ? 'exceeded' : ''}
          />

          {/* Action Toolbar */}
          <div className="toolbar">
            <div className="icons">
              <button className="icon-btn" title="Add Image">🖼️</button>
              <button className="icon-btn" title="Add Emoji">😊</button>
              <button className="icon-btn" title="Add Tag">🏷️</button>
            </div>

            {/* 2 & 3. Live Character Counter & Limit Exceeded Message */}
            <div className="counter-container">
              {/* 3. Red "Limit exceeded" message when text > 100 */}
              {isExceeded && (
                <span className="limit-error">Limit exceeded</span>
              )}

              {/* 2. Live character counter (e.g. 45 / 100) */}
              <span className={`counter-text ${isExceeded ? 'exceeded' : ''}`}>
                {charCount} / {MAX_LIMIT}
              </span>
            </div>
          </div>

          {/* 4. Disable Post button when empty or over limit */}
          <button
            className="post-btn"
            disabled={isButtonDisabled}
            onClick={handlePost}
          >
            Post
          </button>

          {posted && <div className="toast">✨ Post published successfully!</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PostBox />);
  </script>

</body>
</html>
